<svg viewBox="0 0 860 1630" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="1630" fill="#f8f9fa" rx="10"/>

  <defs>
    <clipPath id="mod1"><rect x="40" y="108" width="780" height="200" rx="8"/></clipPath>
    <clipPath id="mod2"><rect x="40" y="340" width="780" height="188" rx="8"/></clipPath>
    <clipPath id="mod3"><rect x="40" y="560" width="780" height="424" rx="8"/></clipPath>
    <clipPath id="mod4"><rect x="40" y="1016" width="780" height="292" rx="8"/></clipPath>
    <clipPath id="gen"><rect x="40" y="1340" width="780" height="250" rx="8"/></clipPath>
  </defs>

  <rect x="230" y="24" width="400" height="56" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="8"/>
  <text x="430" y="58" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle" fill="#2c3e50">Input: "the big cat sat on the big"</text>
  <path d="M 430,80 L 430,108" stroke="#6b7280" stroke-width="2" fill="none"/>

  <g clip-path="url(#mod1)">
    <rect x="40" y="108" width="780" height="200" fill="#ffffff"/>
    <rect x="40" y="108" width="780" height="48" fill="#3498db"/>
    <text x="430" y="138" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">MODULE 1: From Text to Numbers</text>
    <text x="70" y="190" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Tokenization</text>
    <text x="70" y="214" font-family="ui-monospace, monospace" font-size="14" fill="#4b5563">text → token ids</text>
    <text x="70" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Embeddings</text>
    <text x="70" y="282" font-family="ui-monospace, monospace" font-size="14" fill="#4b5563">token id → one vector (a row of the embedding matrix)</text>
  </g>
  <rect x="40" y="108" width="780" height="200" fill="none" stroke="#3498db" stroke-width="2" rx="8"/>
  <path d="M 430,308 L 430,340" stroke="#6b7280" stroke-width="2" fill="none"/>

  <g clip-path="url(#mod2)">
    <rect x="40" y="340" width="780" height="188" fill="#ffffff"/>
    <rect x="40" y="340" width="780" height="48" fill="#f39c12"/>
    <text x="430" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">MODULE 2: Predicting the Next Word</text>
    <text x="70" y="422" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">LM head, last token only</text>
    <text x="70" y="446" font-family="ui-monospace, monospace" font-size="14" fill="#4b5563">last vector @ W_lm → one score per vocabulary word</text>
    <text x="70" y="486" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Softmax</text>
    <text x="70" y="510" font-family="ui-monospace, monospace" font-size="14" fill="#4b5563">scores → probabilities that sum to 1</text>
  </g>
  <rect x="40" y="340" width="780" height="188" fill="none" stroke="#f39c12" stroke-width="2" rx="8"/>
  <path d="M 430,528 L 430,560" stroke="#6b7280" stroke-width="2" fill="none"/>

  <g clip-path="url(#mod3)">
    <rect x="40" y="560" width="780" height="424" fill="#ffffff"/>
    <rect x="40" y="560" width="780" height="48" fill="#9b59b6"/>
    <text x="430" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">MODULE 3: Attention</text>
    <text x="70" y="646" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Positional encoding</text>
    <text x="70" y="670" font-family="ui-monospace, monospace" font-size="14" fill="#4b5563">add a position vector to each token embedding</text>
    <rect x="60" y="692" width="740" height="200" fill="#f3e8ff" stroke="#a78bfa" stroke-width="1" rx="6"/>
    <text x="80" y="720" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">One attention head</text>
    <text x="80" y="750" font-family="ui-monospace, monospace" font-size="13" fill="#4b5563">Q = X @ W_Q</text>
    <text x="250" y="750" font-family="Arial, sans-serif" font-size="13" fill="#7c3aed">query: what this token is looking for</text>
    <text x="80" y="774" font-family="ui-monospace, monospace" font-size="13" fill="#4b5563">K = X @ W_K</text>
    <text x="250" y="774" font-family="Arial, sans-serif" font-size="13" fill="#7c3aed">key: how a token offers itself</text>
    <text x="80" y="798" font-family="ui-monospace, monospace" font-size="13" fill="#4b5563">V = X @ W_V</text>
    <text x="250" y="798" font-family="Arial, sans-serif" font-size="13" fill="#7c3aed">value: what it passes on</text>
    <text x="80" y="834" font-family="ui-monospace, monospace" font-size="13" fill="#4b5563">scores = (Q @ K^T) / √d_k</text>
    <text x="360" y="834" font-family="ui-monospace, monospace" font-size="13" fill="#4b5563">weights = softmax(scores)</text>
    <text x="80" y="866" font-family="ui-monospace, monospace" font-size="13" fill="#4b5563">output = weights @ V</text>
    <text x="70" y="930" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Multi-head</text>
    <text x="70" y="954" font-family="ui-monospace, monospace" font-size="14" fill="#4b5563">concatenate the head outputs, then @ W_O</text>
  </g>
  <rect x="40" y="560" width="780" height="424" fill="none" stroke="#9b59b6" stroke-width="2" rx="8"/>
  <path d="M 430,984 L 430,1016" stroke="#6b7280" stroke-width="2" fill="none"/>

  <g clip-path="url(#mod4)">
    <rect x="40" y="1016" width="780" height="292" fill="#ffffff"/>
    <rect x="40" y="1016" width="780" height="48" fill="#27ae60"/>
    <text x="430" y="1046" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">MODULE 4: The Transformer Block</text>
    <text x="70" y="1102" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Attention sublayer</text>
    <text x="70" y="1126" font-family="ui-monospace, monospace" font-size="14" fill="#4b5563">x + Attention(LayerNorm(x))</text>
    <text x="70" y="1170" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Feed-forward sublayer</text>
    <text x="70" y="1194" font-family="ui-monospace, monospace" font-size="14" fill="#4b5563">h + FeedForward(LayerNorm(h))</text>
    <text x="70" y="1218" font-family="ui-monospace, monospace" font-size="13" fill="#6b7280">FeedForward: linear → GELU → linear, per token</text>
    <text x="70" y="1262" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Stack</text>
    <text x="70" y="1286" font-family="ui-monospace, monospace" font-size="14" fill="#4b5563">repeat the block, then the Module 2 head on the last position</text>
  </g>
  <rect x="40" y="1016" width="780" height="292" fill="none" stroke="#27ae60" stroke-width="2" rx="8"/>
  <path d="M 430,1308 L 430,1340" stroke="#6b7280" stroke-width="2" fill="none"/>

  <g clip-path="url(#gen)">
    <rect x="40" y="1340" width="780" height="250" fill="#ffffff"/>
    <rect x="40" y="1340" width="780" height="48" fill="#e74c3c"/>
    <text x="430" y="1370" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">GENERATION</text>
    <text x="70" y="1426" font-family="ui-monospace, monospace" font-size="14" fill="#4b5563">last vector @ W_lm → scores → softmax</text>
    <text x="70" y="1458" font-family="ui-monospace, monospace" font-size="14" fill="#4b5563">greedy, temperature, or top-k → next token</text>
    <text x="70" y="1490" font-family="ui-monospace, monospace" font-size="14" fill="#4b5563">append the token and run the forward pass again</text>
    <rect x="230" y="1514" width="400" height="48" fill="#fef2f2" stroke="#e74c3c" stroke-width="2" rx="8"/>
    <text x="430" y="1544" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle" fill="#dc2626">Output: next token</text>
  </g>
  <rect x="40" y="1340" width="780" height="250" fill="none" stroke="#e74c3c" stroke-width="2" rx="8"/>
</svg>
